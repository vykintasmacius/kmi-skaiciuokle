<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow">
        <div class="card-body">
          <h1 class="card-title mb-4">BMI Calculator</h1>
          <form>
            <div class="mb-3">
              <label for="weight" class="form-label">Weight (kg)</label>
              <input type="number" id="weight" name="weight" class="form-control" [(ngModel)]="weight">
            </div>
            <div class="mb-3">
              <label for="height" class="form-label">Height (cm)</label>
              <input type="number" id="height" name="height" class="form-control" [(ngModel)]="height">
            </div>
            <button type="submit" class="btn btn-primary" (click)="calculate()">Calculate</button>
          </form>
        </div>
      </div>

      @if (status === 'ok') {
        <div class="alert alert-success mt-3">Your BMI is: {{bmi.toFixed(2)}}</div>
      }
      @else if (status === 'error') {
        <div class="alert alert-danger mt-3">Weight and height must be greater than 0!</div>
      }

    </div>
  </div>
</div>
